<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8"><title>하나의 실패에 여러 원인이 모인다</title><style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --serif: Charter, "Times New Roman", AppleMyungjo, "Hiragino Mincho ProN", "Songti SC", serif;
    --sans: "Helvetica Neue", Arial, "Apple SD Gothic Neo", "Hiragino Sans", "PingFang SC", sans-serif;
    --mono: "SF Mono", Menlo, ui-monospace, monospace;
  }
  body{width:1200px;height:760px;overflow:hidden;font-family:var(--sans);
       background:#ffffff;color:#121212;padding:48px 40px;
       display:flex;flex-direction:column;
       -webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
  .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:0.18em;color:#666666}
  h1{font-family:var(--serif);font-size:40px;font-weight:400;letter-spacing:-0.02em;
     line-height:1.15;margin:8px 0 16px}
  svg{width:100%;display:block}
  svg text{font-family:var(--sans)}
  svg text.mono{font-family:var(--mono)}
</style></head>
<body>
  <p class="eyebrow">원인 분해 · JUSTSEND 기록</p>
  <h1>하나의 실패에 여러 원인이 모인다</h1>
  <svg viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg" data-type="cause"
       role="img" aria-labelledby="record-hero-title record-hero-desc">
    <title id="record-hero-title">세 원인 묶음이 등뼈를 타고 하나의 결과에 모이는 그림</title>
    <desc id="record-hero-desc">세 원인 묶음이 등뼈에 직각으로 붙어 하나의 결과에 모이며, 갈비는 기울지 않는다.</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#363636"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#d0021b"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="#ffffff"/>
    <line x1="104" y1="240" x2="824" y2="240" stroke="#363636" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="232" y1="144" x2="232" y2="240" stroke="#363636" stroke-width="1"/>
    <line x1="424" y1="144" x2="424" y2="240" stroke="#363636" stroke-width="1"/>
    <line x1="616" y1="240" x2="616" y2="336" stroke="#363636" stroke-width="1"/>
    <rect x="152" y="88" width="160" height="56" fill="#ffffff" stroke="#121212" stroke-width="1.2"/>
    <text x="232" y="120" font-size="12" font-weight="600" fill="#121212" text-anchor="middle">원인 묶음</text>
    <rect x="344" y="88" width="160" height="56" fill="#ffffff" stroke="#121212" stroke-width="1.2"/>
    <text x="424" y="120" font-size="12" font-weight="600" fill="#121212" text-anchor="middle">원인 묶음</text>
    <rect x="536" y="336" width="160" height="56" fill="#ffffff" stroke="#121212" stroke-width="1.2"/>
    <text x="616" y="368" font-size="12" font-weight="600" fill="#121212" text-anchor="middle">원인 묶음</text>
    <rect x="832" y="192" width="136" height="96" fill="rgba(208,2,27,0.06)" stroke="#d0021b" stroke-width="1.2"/>
    <text x="900" y="234" font-size="12" font-weight="600" fill="#121212" text-anchor="middle">결과</text>
    <text x="900" y="256" class="mono" font-size="9" fill="#666666" text-anchor="middle">무엇이 깨졌다</text>
    <text x="104" y="268" class="mono" font-size="9" fill="#666666" text-anchor="start">여기서 시작</text>
    <line x1="40" y1="408" x2="960" y2="408" stroke="#e2e2e2" stroke-width="1"/>
    <text x="40" y="436" class="mono" font-size="9" fill="#666666">등뼈 = 결과로 가는 길 · 직각 갈비 = 원인 묶음 · 붉은 테두리 = 결과</text>
  </svg>
</body>
</html>
