<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8"><title>두 축이 선택지를 자리에 놓는다</title><style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --serif: Charter, "Times New Roman", AppleMyungjo, "Hiragino Mincho ProN", "Songti SC", serif;
    --sans: "Helvetica Neue", Arial, "Apple SD Gothic Neo", "Hiragino Sans", "PingFang SC", sans-serif;
    --mono: "SF Mono", Menlo, ui-monospace, monospace;
  }
  body{width:1200px;height:840px;overflow:hidden;font-family:var(--sans);
       background:#ffffff;color:#121212;padding:48px 40px;
       display:flex;flex-direction:column;
       -webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
  .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:0.18em;color:#666666}
  h1{font-family:var(--serif);font-size:40px;font-weight:400;letter-spacing:-0.02em;
     line-height:1.15;margin:8px 0 16px}
  svg{width:100%;display:block}
  svg text{font-family:var(--sans)}
  svg text.mono{font-family:var(--mono)}
</style></head>
<body>
  <p class="eyebrow">비교 · JUSTSEND 기록</p>
  <h1>두 축이 선택지를 자리에 놓는다</h1>
  <svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" data-type="comparison"
       role="img" aria-labelledby="record-hero-title record-hero-desc">
    <title id="record-hero-title">두 기준으로 놓은 여섯 선택지와 하나의 초점</title>
    <desc id="record-hero-desc">가로와 세로 두 기준으로 여섯 선택지를 놓고, 두 기준을 모두 만족하는 하나만 붉은 테두리로 초점을 준다.</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#363636"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#d0021b"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="#ffffff"/>
    <line x1="120" y1="464" x2="944" y2="464" stroke="#363636" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="120" y1="464" x2="120" y2="88" stroke="#363636" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="936" y="484" class="mono" font-size="9" fill="#666666" text-anchor="end">가로 기준</text>
    <text x="136" y="96" class="mono" font-size="9" fill="#666666" text-anchor="start">세로 기준</text>
    <text x="200" y="132" class="mono" font-size="9" fill="#666666" text-anchor="start">왼쪽 위</text>
    <text x="880" y="132" class="mono" font-size="9" fill="#666666" text-anchor="end">오른쪽 위</text>
    <text x="200" y="440" class="mono" font-size="9" fill="#666666" text-anchor="start">왼쪽 아래</text>
    <text x="880" y="440" class="mono" font-size="9" fill="#666666" text-anchor="end">오른쪽 아래</text>
    <rect x="184" y="176" width="136" height="36" rx="8" fill="rgba(18,18,18,0.03)" stroke="#e2e2e2" stroke-width="1"/>
    <text x="252" y="199" class="mono" font-size="9" fill="#363636" text-anchor="middle">선택지</text>
    <rect x="184" y="344" width="136" height="36" rx="8" fill="rgba(18,18,18,0.03)" stroke="#e2e2e2" stroke-width="1"/>
    <text x="252" y="367" class="mono" font-size="9" fill="#363636" text-anchor="middle">선택지</text>
    <rect x="408" y="256" width="136" height="36" rx="8" fill="rgba(18,18,18,0.03)" stroke="#e2e2e2" stroke-width="1"/>
    <text x="476" y="279" class="mono" font-size="9" fill="#363636" text-anchor="middle">선택지</text>
    <rect x="408" y="392" width="136" height="36" rx="8" fill="rgba(18,18,18,0.03)" stroke="#e2e2e2" stroke-width="1"/>
    <text x="476" y="415" class="mono" font-size="9" fill="#363636" text-anchor="middle">선택지</text>
    <rect x="680" y="320" width="136" height="36" rx="8" fill="rgba(18,18,18,0.03)" stroke="#e2e2e2" stroke-width="1"/>
    <text x="748" y="343" class="mono" font-size="9" fill="#363636" text-anchor="middle">선택지</text>
    <rect x="680" y="168" width="136" height="36" rx="8" fill="rgba(18,18,18,0.03)" stroke="#d0021b" stroke-width="1"/>
    <text x="748" y="191" class="mono" font-size="9" fill="#363636" text-anchor="middle">고른 것</text>
    <line x1="40" y1="496" x2="960" y2="496" stroke="#e2e2e2" stroke-width="1"/>
    <text x="40" y="524" class="mono" font-size="9" fill="#666666">칩 = 선택지 · 축 = 두 기준 · 붉은 테두리 = 고른 것</text>
  </svg>
</body>
</html>
