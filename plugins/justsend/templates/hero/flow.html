<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8"><title>판단이 결과를 가르는 자리</title><style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --serif: Charter, "Times New Roman", AppleMyungjo, "Hiragino Mincho ProN", "Songti SC", serif;
    --sans: "Helvetica Neue", Arial, "Apple SD Gothic Neo", "Hiragino Sans", "PingFang SC", sans-serif;
    --mono: "SF Mono", Menlo, ui-monospace, monospace;
  }
  body{width:1200px;height:900px;overflow:hidden;font-family:var(--sans);
       background:#ffffff;color:#121212;padding:48px 40px;
       display:flex;flex-direction:column;
       -webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
  .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:0.18em;color:#666666}
  h1{font-family:var(--serif);font-size:40px;font-weight:400;letter-spacing:-0.02em;
     line-height:1.15;margin:8px 0 16px}
  svg{width:100%;display:block}
  svg text{font-family:var(--sans)}
  svg text.mono{font-family:var(--mono)}
</style></head>
<body>
  <p class="eyebrow">흐름 · JUSTSEND 기록</p>
  <h1>판단이 결과를 가르는 자리</h1>
  <svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" data-type="flow"
       role="img" aria-labelledby="record-hero-title record-hero-desc">
    <title id="record-hero-title">한 판단이 두 갈래로 갈라지는 흐름</title>
    <desc id="record-hero-desc">시작에서 한 단계를 지나 판단에 닿고, 조건을 만족하면 아래로 진행하고 만족하지 못하면 오른쪽 막다른 길로 빠진다.</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#363636"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#d0021b"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="#ffffff"/>
    <line x1="500" y1="92" x2="500" y2="132" stroke="#363636" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="500" y1="208" x2="500" y2="236" stroke="#363636" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="500" y1="352" x2="500" y2="396" stroke="#363636" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="500" y1="472" x2="500" y2="504" stroke="#363636" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="600" y1="296" x2="720" y2="296" stroke="#d0021b" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="628" y="268" width="52" height="20" fill="#ffffff"/>
    <text x="656" y="282" class="mono" font-size="8" fill="#d0021b" text-anchor="middle">아니오</text>
    <rect x="508" y="364" width="28" height="20" fill="#ffffff"/>
    <text x="522" y="378" class="mono" font-size="8" fill="#666666" text-anchor="middle">예</text>
    <ellipse cx="500" cy="64" rx="88" ry="28" fill="rgba(18,18,18,0.03)" stroke="#121212" stroke-width="1.2"/>
    <text x="500" y="68" font-size="12" fill="#121212" text-anchor="middle" font-weight="600">시작</text>
    <rect x="412" y="136" width="176" height="72" fill="#ffffff" stroke="#121212" stroke-width="1.2"/>
    <text x="500" y="166" font-size="12" font-weight="600" fill="#121212" text-anchor="middle">단계 이름</text>
    <text x="500" y="188" class="mono" font-size="9" fill="#666666" text-anchor="middle">무엇을 한다</text>
    <polygon points="500 240, 596 296, 500 352, 404 296" fill="#ffffff" stroke="#121212" stroke-width="1.2"/>
    <text x="500" y="300" font-size="12" fill="#121212" text-anchor="middle" font-weight="600">조건</text>
    <rect x="412" y="400" width="176" height="72" fill="#ffffff" stroke="#121212" stroke-width="1.2"/>
    <text x="500" y="430" font-size="12" font-weight="600" fill="#121212" text-anchor="middle">다음 단계</text>
    <text x="500" y="452" class="mono" font-size="9" fill="#666666" text-anchor="middle">그래서 무엇</text>
    <rect x="724" y="260" width="176" height="72" fill="rgba(208,2,27,0.06)" stroke="#d0021b" stroke-width="1.2"/>
    <text x="812" y="290" font-size="12" font-weight="600" fill="#121212" text-anchor="middle">막다른 길</text>
    <text x="812" y="312" class="mono" font-size="9" fill="#666666" text-anchor="middle">왜 멈췄다</text>
    <ellipse cx="500" cy="536" rx="88" ry="28" fill="rgba(18,18,18,0.03)" stroke="#121212" stroke-width="1.2"/>
    <text x="500" y="540" font-size="12" fill="#121212" text-anchor="middle" font-weight="600">끝</text>
    <line x1="40" y1="592" x2="960" y2="592" stroke="#e2e2e2" stroke-width="1"/>
    <text x="40" y="620" class="mono" font-size="9" fill="#666666">타원 = 시작·끝 · 사각 = 단계 · 마름모 = 판단 · 붉은 테두리 = 막다른 길</text>
  </svg>
</body>
</html>
