<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8"><title>조건이 맞을 때까지 되돌아온다</title><style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --serif: Charter, "Times New Roman", AppleMyungjo, "Hiragino Mincho ProN", "Songti SC", serif;
    --sans: "Helvetica Neue", Arial, "Apple SD Gothic Neo", "Hiragino Sans", "PingFang SC", sans-serif;
    --mono: "SF Mono", Menlo, ui-monospace, monospace;
  }
  body{width:1200px;height:760px;overflow:hidden;font-family:var(--sans);
       background:#ffffff;color:#121212;padding:48px 40px;
       display:flex;flex-direction:column;
       -webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
  .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:0.18em;color:#666666}
  h1{font-family:var(--serif);font-size:40px;font-weight:400;letter-spacing:-0.02em;
     line-height:1.15;margin:8px 0 16px}
  svg{width:100%;display:block}
  svg text{font-family:var(--sans)}
  svg text.mono{font-family:var(--mono)}
</style></head>
<body>
  <p class="eyebrow">루프 · JUSTSEND 기록</p>
  <h1>조건이 맞을 때까지 되돌아온다</h1>
  <svg viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg" data-type="loop"
       role="img" aria-labelledby="record-hero-title record-hero-desc">
    <title id="record-hero-title">세 단계를 돌며 조건이 맞을 때까지 되돌아오는 주기</title>
    <desc id="record-hero-desc">세 단계를 차례로 지나고 마지막에서 조건을 만족하지 못하면 첫 단계로 되돌아가며, 만족하면 주기를 벗어난다.</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#363636"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#d0021b"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="#ffffff"/>
    <line x1="304" y1="192" x2="396" y2="192" stroke="#363636" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="604" y1="192" x2="696" y2="192" stroke="#363636" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 800 240 L 800 312 A 8 8 0 0 1 792 320 L 208 320 A 8 8 0 0 1 200 312 L 200 240" fill="none" stroke="#d0021b" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="324" y="160" width="52" height="20" fill="#ffffff"/>
    <text x="350" y="174" class="mono" font-size="8" fill="#666666" text-anchor="middle">그다음</text>
    <rect x="624" y="160" width="52" height="20" fill="#ffffff"/>
    <text x="650" y="174" class="mono" font-size="8" fill="#666666" text-anchor="middle">그다음</text>
    <rect x="460" y="292" width="88" height="20" fill="#ffffff"/>
    <text x="504" y="306" class="mono" font-size="8" fill="#d0021b" text-anchor="middle">조건 미달이면</text>
    <rect x="104" y="144" width="192" height="96" fill="#ffffff" stroke="#121212" stroke-width="1.2"/>
    <text x="200" y="186" font-size="12" font-weight="600" fill="#121212" text-anchor="middle">첫 단계</text>
    <text x="200" y="208" class="mono" font-size="9" fill="#666666" text-anchor="middle">무엇을 한다</text>
    <rect x="404" y="144" width="192" height="96" fill="#ffffff" stroke="#121212" stroke-width="1.2"/>
    <text x="500" y="186" font-size="12" font-weight="600" fill="#121212" text-anchor="middle">두 번째</text>
    <text x="500" y="208" class="mono" font-size="9" fill="#666666" text-anchor="middle">무엇을 한다</text>
    <rect x="704" y="144" width="192" height="96" fill="#ffffff" stroke="#121212" stroke-width="1.2"/>
    <text x="800" y="186" font-size="12" font-weight="600" fill="#121212" text-anchor="middle">판정</text>
    <text x="800" y="208" class="mono" font-size="9" fill="#666666" text-anchor="middle">조건을 본다</text>
    <line x1="40" y1="400" x2="960" y2="400" stroke="#e2e2e2" stroke-width="1"/>
    <text x="40" y="428" class="mono" font-size="9" fill="#666666">사각 = 단계 · 붉은 경로 = 되돌아오는 조건</text>
  </svg>
</body>
</html>
