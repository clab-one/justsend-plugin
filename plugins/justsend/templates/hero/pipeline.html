<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8"><title>순서만 있고 분기는 없다</title><style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --serif: Charter, "Times New Roman", AppleMyungjo, "Hiragino Mincho ProN", "Songti SC", serif;
    --sans: "Helvetica Neue", Arial, "Apple SD Gothic Neo", "Hiragino Sans", "PingFang SC", sans-serif;
    --mono: "SF Mono", Menlo, ui-monospace, monospace;
  }
  body{width:1200px;height:760px;overflow:hidden;font-family:var(--sans);
       background:#ffffff;color:#121212;padding:48px 40px;
       display:flex;flex-direction:column;
       -webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
  .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:0.18em;color:#666666}
  h1{font-family:var(--serif);font-size:40px;font-weight:400;letter-spacing:-0.02em;
     line-height:1.15;margin:8px 0 16px}
  svg{width:100%;display:block}
  svg text{font-family:var(--sans)}
  svg text.mono{font-family:var(--mono)}
</style></head>
<body>
  <p class="eyebrow">단계 · JUSTSEND 기록</p>
  <h1>순서만 있고 분기는 없다</h1>
  <svg viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg" data-type="pipeline"
       role="img" aria-labelledby="record-hero-title record-hero-desc">
    <title id="record-hero-title">네 단계를 지나며 들고 나가는 것</title>
    <desc id="record-hero-desc">들어온 것이 네 단계를 순서대로 지나 하나의 결과로 나가고, 세 번째 단계에서만 거절이 일어난다.</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#363636"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#d0021b"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="#ffffff"/>
    <line x1="124" y1="108" x2="124" y2="170" stroke="#363636" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="216" y1="224" x2="284" y2="224" stroke="#363636" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="472" y1="224" x2="540" y2="224" stroke="#363636" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="728" y1="224" x2="796" y2="224" stroke="#363636" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="892" y1="276" x2="892" y2="316" stroke="#363636" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="224" y="192" width="52" height="20" fill="#ffffff"/>
    <text x="250" y="206" class="mono" font-size="8" fill="#666666" text-anchor="middle">무엇이</text>
    <rect x="480" y="192" width="52" height="20" fill="#ffffff"/>
    <text x="506" y="206" class="mono" font-size="8" fill="#666666" text-anchor="middle">그대로</text>
    <rect x="732" y="192" width="56" height="20" fill="#ffffff"/>
    <text x="762" y="206" class="mono" font-size="8" fill="#666666" text-anchor="middle">대조한다</text>
    <rect x="36" y="72" width="176" height="36" rx="8" fill="rgba(18,18,18,0.03)" stroke="#e2e2e2" stroke-width="1"/>
    <text x="124" y="95" class="mono" font-size="9" fill="#363636" text-anchor="middle">들어오는 것</text>
    <rect x="804" y="316" width="176" height="36" rx="8" fill="rgba(18,18,18,0.03)" stroke="#e2e2e2" stroke-width="1"/>
    <text x="892" y="339" class="mono" font-size="9" fill="#363636" text-anchor="middle">나가는 것</text>
    <rect x="40" y="176" width="168" height="96" fill="#ffffff" stroke="#121212" stroke-width="1.2"/>
    <text x="124" y="218" font-size="12" font-weight="600" fill="#121212" text-anchor="middle">첫 단계</text>
    <text x="124" y="240" class="mono" font-size="9" fill="#666666" text-anchor="middle">무엇을 한다</text>
    <rect x="296" y="176" width="168" height="96" fill="#ffffff" stroke="#121212" stroke-width="1.2"/>
    <text x="380" y="218" font-size="12" font-weight="600" fill="#121212" text-anchor="middle">두 번째</text>
    <text x="380" y="240" class="mono" font-size="9" fill="#666666" text-anchor="middle">무엇을 한다</text>
    <rect x="552" y="176" width="168" height="96" fill="rgba(208,2,27,0.06)" stroke="#d0021b" stroke-width="1.2"/>
    <text x="636" y="218" font-size="12" font-weight="600" fill="#121212" text-anchor="middle">세 번째</text>
    <text x="636" y="240" class="mono" font-size="9" fill="#666666" text-anchor="middle">여기서 거절</text>
    <rect x="808" y="176" width="168" height="96" fill="#ffffff" stroke="#121212" stroke-width="1.2"/>
    <text x="892" y="218" font-size="12" font-weight="600" fill="#121212" text-anchor="middle">마지막</text>
    <text x="892" y="240" class="mono" font-size="9" fill="#666666" text-anchor="middle">무엇이 남는다</text>
    <line x1="40" y1="400" x2="976" y2="400" stroke="#e2e2e2" stroke-width="1"/>
    <text x="40" y="428" class="mono" font-size="9" fill="#666666">사각 = 단계 · 둥근 칩 = 들고 나가는 것 · 붉은 테두리 = 거절이 일어나는 곳</text>
  </svg>
</body>
</html>
