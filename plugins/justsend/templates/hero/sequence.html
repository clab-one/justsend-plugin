<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8"><title>행위자 사이의 메시지, 시간 순으로</title><style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --serif: Charter, "Times New Roman", AppleMyungjo, "Hiragino Mincho ProN", "Songti SC", serif;
    --sans: "Helvetica Neue", Arial, "Apple SD Gothic Neo", "Hiragino Sans", "PingFang SC", sans-serif;
    --mono: "SF Mono", Menlo, ui-monospace, monospace;
  }
  body{width:1200px;height:840px;overflow:hidden;font-family:var(--sans);
       background:#ffffff;color:#121212;padding:48px 40px;
       display:flex;flex-direction:column;
       -webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
  .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:0.18em;color:#666666}
  h1{font-family:var(--serif);font-size:40px;font-weight:400;letter-spacing:-0.02em;
     line-height:1.15;margin:8px 0 16px}
  svg{width:100%;display:block}
  svg text{font-family:var(--sans)}
  svg text.mono{font-family:var(--mono)}
</style></head>
<body>
  <p class="eyebrow">순서 · JUSTSEND 기록</p>
  <h1>행위자 사이의 메시지, 시간 순으로</h1>
  <svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" data-type="sequence"
       role="img" aria-labelledby="record-hero-title record-hero-desc">
    <title id="record-hero-title">세 행위자가 주고받는 네 메시지의 시간 순서</title>
    <desc id="record-hero-desc">왼쪽 행위자가 요청을 보내고 가운데가 검증한 뒤, 오른쪽이 거절을 돌려보내 실패가 처음 보낸 쪽까지 전해진다.</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#363636"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#d0021b"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="#ffffff"/>
    <line x1="192" y1="120" x2="192" y2="440" stroke="#e2e2e2" stroke-width="1" stroke-dasharray="3 4"/>
    <line x1="500" y1="120" x2="500" y2="440" stroke="#e2e2e2" stroke-width="1" stroke-dasharray="3 4"/>
    <line x1="808" y1="120" x2="808" y2="440" stroke="#e2e2e2" stroke-width="1" stroke-dasharray="3 4"/>
    <line x1="192" y1="176" x2="496" y2="176" stroke="#363636" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="500" y1="240" x2="804" y2="240" stroke="#363636" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="808" y1="304" x2="504" y2="304" stroke="#d0021b" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <line x1="500" y1="368" x2="196" y2="368" stroke="#d0021b" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="316" y="148" width="56" height="20" fill="#ffffff"/>
    <text x="344" y="162" class="mono" font-size="8" fill="#666666" text-anchor="middle">요청</text>
    <rect x="624" y="212" width="56" height="20" fill="#ffffff"/>
    <text x="652" y="226" class="mono" font-size="8" fill="#666666" text-anchor="middle">검증</text>
    <rect x="628" y="276" width="56" height="20" fill="#ffffff"/>
    <text x="656" y="290" class="mono" font-size="8" fill="#d0021b" text-anchor="middle">거절</text>
    <rect x="312" y="340" width="72" height="20" fill="#ffffff"/>
    <text x="348" y="354" class="mono" font-size="8" fill="#d0021b" text-anchor="middle">실패 통지</text>
    <rect x="104" y="64" width="176" height="56" fill="#ffffff" stroke="#121212" stroke-width="1.2"/>
    <text x="192" y="96" font-size="12" font-weight="600" fill="#121212" text-anchor="middle">행위자 하나</text>
    <rect x="412" y="64" width="176" height="56" fill="#ffffff" stroke="#121212" stroke-width="1.2"/>
    <text x="500" y="96" font-size="12" font-weight="600" fill="#121212" text-anchor="middle">행위자 둘</text>
    <rect x="720" y="64" width="176" height="56" fill="#ffffff" stroke="#121212" stroke-width="1.2"/>
    <text x="808" y="96" font-size="12" font-weight="600" fill="#121212" text-anchor="middle">행위자 셋</text>
    <line x1="40" y1="496" x2="960" y2="496" stroke="#e2e2e2" stroke-width="1"/>
    <text x="40" y="524" class="mono" font-size="9" fill="#666666">사각 = 행위자 · 파선 = 생명선 · 화살표 = 메시지 · 붉은색 = 거절</text>
  </svg>
</body>
</html>
