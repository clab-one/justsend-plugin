<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8"><title>부분과, 누가 누구를 부르는가</title><style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --serif: Charter, "Times New Roman", AppleMyungjo, "Hiragino Mincho ProN", "Songti SC", serif;
    --sans: "Helvetica Neue", Arial, "Apple SD Gothic Neo", "Hiragino Sans", "PingFang SC", sans-serif;
    --mono: "SF Mono", Menlo, ui-monospace, monospace;
  }
  body{width:1200px;height:840px;overflow:hidden;font-family:var(--sans);
       background:#ffffff;color:#121212;padding:48px 40px;
       display:flex;flex-direction:column;
       -webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
  .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:0.18em;color:#666666}
  h1{font-family:var(--serif);font-size:40px;font-weight:400;letter-spacing:-0.02em;
     line-height:1.15;margin:8px 0 16px}
  svg{width:100%;display:block}
  svg text{font-family:var(--sans)}
  svg text.mono{font-family:var(--mono)}
</style></head>
<body>
  <p class="eyebrow">구조 · JUSTSEND 기록</p>
  <h1>부분과, 누가 누구를 부르는가</h1>
  <svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" data-type="structure"
       role="img" aria-labelledby="record-hero-title record-hero-desc">
    <title id="record-hero-title">두 구역에 나뉜 다섯 부분과 그 사이의 호출</title>
    <desc id="record-hero-desc">왼쪽 구역의 부분들이 오른쪽 구역의 입구를 부르고, 구역 안의 한 호출만 비동기라서 파선으로 그렸다.</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#363636"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#d0021b"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="#ffffff"/>
    <line x1="452" y1="188" x2="548" y2="188" stroke="#363636" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="460" y="156" width="80" height="20" fill="#ffffff"/>
    <text x="500" y="170" class="mono" font-size="8" fill="#666666" text-anchor="middle">무엇을 부른다</text>
    <line x1="740" y1="232" x2="740" y2="252" stroke="#363636" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
    <rect x="40" y="96" width="440" height="280" fill="none" stroke="#e2e2e2" stroke-width="1"/>
    <text x="56" y="88" class="mono" font-size="9" fill="#666666" text-anchor="start">구역 하나</text>
    <rect x="520" y="96" width="440" height="280" fill="none" stroke="#e2e2e2" stroke-width="1"/>
    <text x="536" y="88" class="mono" font-size="9" fill="#666666" text-anchor="start">구역 둘</text>
    <rect x="72" y="144" width="176" height="88" fill="#ffffff" stroke="#121212" stroke-width="1.2"/>
    <text x="160" y="182" font-size="12" font-weight="600" fill="#121212" text-anchor="middle">부분</text>
    <text x="160" y="204" class="mono" font-size="9" fill="#666666" text-anchor="middle">무엇을 안다</text>
    <rect x="272" y="144" width="176" height="88" fill="#ffffff" stroke="#121212" stroke-width="1.2"/>
    <text x="360" y="182" font-size="12" font-weight="600" fill="#121212" text-anchor="middle">부분</text>
    <text x="360" y="204" class="mono" font-size="9" fill="#666666" text-anchor="middle">무엇을 안다</text>
    <rect x="72" y="256" width="376" height="88" fill="#ffffff" stroke="#121212" stroke-width="1.2"/>
    <text x="260" y="294" font-size="12" font-weight="600" fill="#121212" text-anchor="middle">공유하는 부분</text>
    <text x="260" y="316" class="mono" font-size="9" fill="#666666" text-anchor="middle">둘이 같이 쓴다</text>
    <rect x="552" y="144" width="376" height="88" fill="#ffffff" stroke="#121212" stroke-width="1.2"/>
    <text x="740" y="182" font-size="12" font-weight="600" fill="#121212" text-anchor="middle">입구</text>
    <text x="740" y="204" class="mono" font-size="9" fill="#666666" text-anchor="middle">여기로 들어온다</text>
    <rect x="552" y="256" width="376" height="88" fill="#ffffff" stroke="#121212" stroke-width="1.2"/>
    <text x="740" y="294" font-size="12" font-weight="600" fill="#121212" text-anchor="middle">저장</text>
    <text x="740" y="316" class="mono" font-size="9" fill="#666666" text-anchor="middle">무엇이 남는다</text>
    <line x1="40" y1="496" x2="960" y2="496" stroke="#e2e2e2" stroke-width="1"/>
    <text x="40" y="524" class="mono" font-size="9" fill="#666666">사각 = 부분 · 얇은 테두리 = 구역 · 파선 = 비동기 호출</text>
  </svg>
</body>
</html>
