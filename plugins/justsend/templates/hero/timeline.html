<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8"><title>순서가 아니라 간격이 요점일 때</title><style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --serif: Charter, "Times New Roman", AppleMyungjo, "Hiragino Mincho ProN", "Songti SC", serif;
    --sans: "Helvetica Neue", Arial, "Apple SD Gothic Neo", "Hiragino Sans", "PingFang SC", sans-serif;
    --mono: "SF Mono", Menlo, ui-monospace, monospace;
  }
  body{width:1200px;height:680px;overflow:hidden;font-family:var(--sans);
       background:#ffffff;color:#121212;padding:48px 40px;
       display:flex;flex-direction:column;
       -webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
  .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:0.18em;color:#666666}
  h1{font-family:var(--serif);font-size:40px;font-weight:400;letter-spacing:-0.02em;
     line-height:1.15;margin:8px 0 16px}
  svg{width:100%;display:block}
  svg text{font-family:var(--sans)}
  svg text.mono{font-family:var(--mono)}
</style></head>
<body>
  <p class="eyebrow">시간축 · JUSTSEND 기록</p>
  <h1>순서가 아니라 간격이 요점일 때</h1>
  <svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" data-type="timeline"
       role="img" aria-labelledby="record-hero-title record-hero-desc">
    <title id="record-hero-title">네 사건이 시간축 위에 놓인 간격</title>
    <desc id="record-hero-desc">네 사건을 실제 일수에 비례한 자리에 놓아 2일·4일·1일 간격이 그대로 보이게 하고, 실패한 시점 하나만 붉은색으로 표시한다.</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#363636"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#d0021b"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="#ffffff"/>
    <line x1="72" y1="240" x2="944" y2="240" stroke="#363636" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="136" y1="228" x2="136" y2="252" stroke="#363636" stroke-width="1"/>
    <line x1="328" y1="228" x2="328" y2="252" stroke="#363636" stroke-width="1"/>
    <line x1="712" y1="228" x2="712" y2="252" stroke="#d0021b" stroke-width="1.2"/>
    <line x1="808" y1="228" x2="808" y2="252" stroke="#363636" stroke-width="1"/>
    <text x="136" y="208" class="mono" font-size="9" fill="#666666" text-anchor="middle">2026. 8. 20.</text>
    <text x="136" y="188" font-size="12" fill="#121212" text-anchor="middle" font-weight="600">첫 사건</text>
    <text x="328" y="208" class="mono" font-size="9" fill="#666666" text-anchor="middle">2026. 8. 22.</text>
    <text x="328" y="188" font-size="12" fill="#121212" text-anchor="middle" font-weight="600">두 번째</text>
    <text x="712" y="292" class="mono" font-size="9" fill="#d0021b" text-anchor="middle">2026. 8. 26.</text>
    <text x="712" y="312" font-size="12" fill="#121212" text-anchor="middle" font-weight="600">여기서 실패</text>
    <text x="808" y="208" class="mono" font-size="9" fill="#666666" text-anchor="middle">2026. 8. 27.</text>
    <text x="808" y="188" font-size="12" fill="#121212" text-anchor="middle" font-weight="600">고친 시점</text>
    <text x="936" y="272" class="mono" font-size="9" fill="#666666" text-anchor="end">시간</text>
    <text x="72" y="272" class="mono" font-size="9" fill="#666666" text-anchor="start">하루 = 96px</text>
    <line x1="40" y1="344" x2="960" y2="344" stroke="#e2e2e2" stroke-width="1"/>
    <text x="40" y="372" class="mono" font-size="9" fill="#666666">축 = 시간(하루 = 96px) · 짧은 선 = 사건 · 붉은색 = 실패한 시점</text>
  </svg>
</body>
</html>
