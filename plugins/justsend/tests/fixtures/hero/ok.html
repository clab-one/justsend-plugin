<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>그림 도구를 저장소 안으로 옮긴다</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --serif: Charter, "Times New Roman", AppleMyungjo, "Hiragino Mincho ProN", "Songti SC", serif;
      --sans: "Helvetica Neue", Arial, "Apple SD Gothic Neo", "Hiragino Sans", "PingFang SC", sans-serif;
      --mono: "SF Mono", Menlo, ui-monospace, monospace;
    }
    body {
      width: 1200px; height: 900px; overflow: hidden;
      font-family: var(--sans); background: #ffffff; color: #121212;
      padding: 48px 40px; display: flex; flex-direction: column;
      -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision;
    }
    .eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: 0.18em; color: #666666; }
    h1 { font-family: var(--serif); font-size: 40px; font-weight: 400; letter-spacing: -0.02em;
         line-height: 1.15; margin: 8px 0 16px; }
    svg { width: 100%; display: block; }
    svg text { font-family: var(--sans); }
    svg text.mono { font-family: var(--mono); }
  </style>
</head>
<body>
  <p class="eyebrow">흐름 · JUSTSEND 기록</p>
  <h1>그림 도구를 저장소 안으로 옮긴다</h1>

  <svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg"
       role="img" aria-labelledby="record-hero-title record-hero-desc">
    <title id="record-hero-title">기록 그림을 검사하고 굽는 길</title>
    <desc id="record-hero-desc">기록 대표 이미지를 만드는 길: 초안 한 장을 저장소 안의 검사기가 규칙 열 개로 판정하고, 통과한 것만 첫 svg 만 잘라 viewBox 두 배로 굽고, 쓴 크기를 다시 재어 기록에 붙인다. 떨어지면 PNG 를 쓰지 않고 이유를 줄로 말한다.</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#363636"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#d0021b"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- 화살표: 상자보다 먼저 -->
    <line x1="400" y1="80"  x2="400" y2="112" stroke="#363636" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="520" y1="180" x2="692" y2="180" stroke="#d0021b" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
    <line x1="400" y1="236" x2="400" y2="272" stroke="#363636" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="400" y1="324" x2="400" y2="360" stroke="#363636" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="400" y1="412" x2="400" y2="448" stroke="#363636" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- 화살표 낱말: 선과 8px 띄운다 -->
    <rect x="584" y="160" width="32" height="12" rx="2" fill="#ffffff"/>
    <text x="600" y="169" class="mono" fill="#d0021b" font-size="8" text-anchor="middle" letter-spacing="0.12em">아니다</text>

    <rect x="408" y="244" width="32" height="12" rx="2" fill="#ffffff"/>
    <text x="424" y="253" class="mono" fill="#363636" font-size="8" text-anchor="middle" letter-spacing="0.12em">지켰다</text>

    <!-- 초안 -->
    <rect x="300" y="32" width="200" height="48" rx="6" fill="#ffffff" stroke="#121212" stroke-width="1"/>
    <text x="400" y="54" fill="#121212" font-size="12" font-weight="600" text-anchor="middle">초안 한 장</text>
    <text x="400" y="70" class="mono" fill="#666666" font-size="9" text-anchor="middle">self-contained HTML</text>

    <!-- 검사 -->
    <polygon points="400,124 520,180 400,236 280,180" fill="#ffffff" stroke="#121212" stroke-width="1"/>
    <text x="400" y="172" fill="#121212" font-size="12" font-weight="600" text-anchor="middle">규칙 열 개를</text>
    <text x="400" y="188" fill="#121212" font-size="12" font-weight="600" text-anchor="middle">지켰나</text>
    <text x="400" y="208" class="mono" fill="#666666" font-size="9" text-anchor="middle">hero-check.py</text>

    <!-- 막다른 길: 붉은색은 이 지면에서 여기 하나 -->
    <rect x="692" y="152" width="200" height="56" rx="28" fill="rgba(208,2,27,0.06)" stroke="#d0021b" stroke-width="1"/>
    <text x="792" y="176" fill="#121212" font-size="12" font-weight="600" text-anchor="middle">PNG 를 쓰지 않는다</text>
    <text x="792" y="192" class="mono" fill="#666666" font-size="9" text-anchor="middle">exit 1 · 이유를 한 줄씩</text>

    <!-- 굽기 -->
    <rect x="300" y="272" width="200" height="48" rx="6" fill="#ffffff" stroke="#121212" stroke-width="1"/>
    <text x="400" y="294" fill="#121212" font-size="12" font-weight="600" text-anchor="middle">첫 svg 만 굽는다</text>
    <text x="400" y="310" class="mono" fill="#666666" font-size="9" text-anchor="middle">hero-bake.sh · viewBox × 2</text>

    <!-- 대조 -->
    <rect x="300" y="360" width="200" height="48" rx="6" fill="#ffffff" stroke="#121212" stroke-width="1"/>
    <text x="400" y="382" fill="#121212" font-size="12" font-weight="600" text-anchor="middle">쓴 크기를 잰다</text>
    <text x="400" y="398" class="mono" fill="#666666" font-size="9" text-anchor="middle">어긋나면 PNG 를 지운다</text>

    <!-- 기록 -->
    <rect x="300" y="448" width="200" height="56" rx="28" fill="rgba(18,18,18,0.03)" stroke="rgba(18,18,18,0.30)" stroke-width="1"/>
    <text x="400" y="472" fill="#121212" font-size="12" font-weight="600" text-anchor="middle">기록에 붙는다</text>
    <text x="400" y="488" class="mono" fill="#666666" font-size="9" text-anchor="middle">image_path · 한 번뿐</text>

    <!-- 범례 -->
    <line x1="40" y1="580" x2="960" y2="580" stroke="#e2e2e2" stroke-width="0.8"/>
    <text x="40" y="596" class="mono" fill="#666666" font-size="8" letter-spacing="0.18em">범례 · 모양이 종류다</text>

    <rect x="40" y="612" width="24" height="12" rx="6" fill="rgba(18,18,18,0.03)" stroke="rgba(18,18,18,0.30)" stroke-width="1"/>
    <text x="72" y="622" fill="#363636" font-size="8">끝 (타원)</text>

    <rect x="200" y="612" width="24" height="12" rx="2" fill="#ffffff" stroke="#121212" stroke-width="1"/>
    <text x="232" y="622" fill="#363636" font-size="8">단계 (사각)</text>

    <polygon points="388,618 400,612 412,618 400,624" fill="#ffffff" stroke="#121212" stroke-width="1"/>
    <text x="424" y="622" fill="#363636" font-size="8">판단 (마름모)</text>

    <line x1="600" y1="620" x2="628" y2="620" stroke="#d0021b" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
    <text x="636" y="622" fill="#363636" font-size="8">막다른 길</text>

    <line x1="788" y1="620" x2="816" y2="620" stroke="#363636" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="824" y="622" fill="#363636" font-size="8">본길</text>
  </svg>
</body>
</html>
